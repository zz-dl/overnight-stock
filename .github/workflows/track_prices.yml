name: 9:30-10:00 Track Prices
on:
  schedule:
    - cron: '45 20 * * 0-4'  # Start 04:45 CST, then wait through 09:30-10:00 CST
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Record market-session prices
        run: python3 scripts/render_cron_call.py track-session
