name: 15:30 Collect Trade Data
on:
  schedule:
    - cron: '30 7 * * 1-5'   # 周一至周五 07:30 UTC = 15:30 CST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect and save trade data
        run: python3 scripts/render_cron_call.py collect-trade-data
